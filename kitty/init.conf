shell_integration disbale

#: Font Config {{{
font_size    16.0
modify_font  cell_height 125%
modify_font  underline_position     5
modify_font  strikethrough_position 5
adjust_column_width -1
include symbol-map.conf
#: }}}


#: Scrollback {{{
scrollback_lines -1
scrollback_fill_enlarged_window yes
#: }}}


#: Mouse {{{
# url_color #0087bd
# url_style curly

url_prefixes file ftp ftps git http https mailto sftp ssh
# paste_actions quote-urls-at-prompt
strip_trailing_spaces always
select_by_word_characters @-./_~?&=%+#
#: }}}


#: Window layout {{{
remember_window_size  no
initial_window_width  1080
initial_window_height 720

# delete titlebar
hide_window_decorations titlebar-only
enabled_layouts splits, stack
#: }}}


#: Tab bar {{{
tab_bar_style powerline
tab_powerline_style round
#: }}}


#: Color scheme {{{

background_opacity 0.78
background_blur 20
background_image_layout cscaled

#: }}}


#: Advanced {{{

single_instance yes
remote_kitty if-needed
allow_remote_control yes
forward_remote_control yes
listen_on unix:/tmp/mykitty.sock
remote_control_password "kitty"

#: }}}


#: OS specific tweaks {{{

macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in window
macos_colorspace displayp3
text_composition_strategy 1.2 20
# display audio
enable_audio_bell no

#: }}}


#: Keyboard shortcuts {{{

clear_all_shortcuts yes

#: }}}


#: Keymap {{{

#: Font sizes {{{
map cmd+equal  change_font_size all +1.0
map cmd+minus  change_font_size all -1.0
map cmd+0      change_font_size all 0
#: }}}

# Edit current command via neovim, specific to zsh
map ctrl+, send_text normal,application  \x1b[44;5u

#: Integration {{{
map f2 launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
#: }}}

#: Miscellaneous {{{
cursor_trail 1
cursor_trail_decay 0.15 0.4
cursor_trail_start_threshold 0

map cmd+backspace  send_text all \u17
# map cmd+f          combine : show_scrollback : send_text normal,applic
#: }}}

#: Select and act on visible text {{{

# map cmd+o        open_url_with_hints
# https://github.com/kovidgoyal/kitty/issues/371
mouse_map        left click ungrabbed mouse_handle_click prompt
mouse_map        cmd+left click ungrabbed mouse_handle_click link
map cmd+p        kitten hints --type path --program -
map cmd+shift+p  kitten hints --type path

#: }}}


#: Clipboard {{{

map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
map cmd+shift+v  paste_from_selection

clipboard_control write-primary write-clipboard no-append
#: }}}


#: Scrolling {{{

map alt+k  combine : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up
map alt+j  combine : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down

map cmd+/        scroll_to_prompt -1
map cmd+shift+/  scroll_to_prompt 1

map cmd+alt+/  show_last_command_output

#: }}}


#: Keymap {{{

map cmd+t           new_tab
map cmd+w           close_window
map cmd+r           launch --type=overlay --copy-env --cwd=current zsh -c "yazi"
map cmd+f           focus_visible_window
map cmd+[           next_tab
map cmd+]           previous_tab
map cmd+alt+[       swap_with_window
map cmd+alt+]       swap_with_window
map cmd+enter       toggle_layout stack

map alt+1           goto_tab 1
map alt+2           goto_tab 2
map alt+3           goto_tab 3
map alt+4           goto_tab 4
map alt+5           goto_tab 5
map alt+6           goto_tab 6


# jump
map cmd+j           neighboring_window bottom
map cmd+k           neighboring_window top
map cmd+h           neighboring_window left
map cmd+l           neighboring_window right

# split
map cmd+ctrl+l      launch --location=vsplit --cwd=current
map cmd+ctrl+h      launch --location=vsplit --cwd=current --location=before
map cmd+ctrl+j      launch --location=hsplit --cwd=current
map cmd+ctrl+k      launch --location=hsplit --cwd=current --location=before

map ctrl+shift+h    resize_window narrower
map ctrl+shift+l    resize_window wider
map ctrl+shift+k    resize_window shorter
map ctrl+shift+j    resize_window taller

map cmd+shift+h     ignore
map cmd+shift+l     ignore
map cmd+shift+k     set_tab_title
map cmd+shift+j     ignore

#: NVIM {{{

map --when-focus-on var:IS_NVIM   cmd+j
map --when-focus-on var:IS_NVIM   cmd+k
map --when-focus-on var:IS_NVIM   cmd+h
map --when-focus-on var:IS_NVIM   cmd+l

map --when-focus-on var:IS_NVIM   cmd+ctrl+j
map --when-focus-on var:IS_NVIM   cmd+ctrl+k
map --when-focus-on var:IS_NVIM   cmd+ctrl+h
map --when-focus-on var:IS_NVIM   cmd+ctrl+l

map --when-focus-on var:IS_NVIM   ctrl+shift+h
map --when-focus-on var:IS_NVIM   ctrl+shift+l
map --when-focus-on var:IS_NVIM   ctrl+shift+k
map --when-focus-on var:IS_NVIM   ctrl+shift+j

map --when-focus-on var:IS_NVIM   cmd+w
map --when-focus-on var:IS_NVIM   cmd+f
map --when-focus-on var:IS_NVIM   cmd+r
map --when-focus-on var:IS_NVIM   cmd+shift+f
map --when-focus-on var:IS_NVIM   cmd+s
map --when-focus-on var:IS_NVIM   cmd+e
# map --when-focus-on var:IS_NVIM   cmd+enter


# }}}

#: TMUX {{{

map --when-focus-on var:IS_TMUX   cmd+j
map --when-focus-on var:IS_TMUX   cmd+k
map --when-focus-on var:IS_TMUX   cmd+h
map --when-focus-on var:IS_TMUX   cmd+l

map --when-focus-on var:IS_TMUX   cmd+ctrl+j
map --when-focus-on var:IS_TMUX   cmd+ctrl+k
map --when-focus-on var:IS_TMUX   cmd+ctrl+h
map --when-focus-on var:IS_TMUX   cmd+ctrl+l

map --when-focus-on var:IS_TMUX   alt+1           send_key ctrl+a 1
map --when-focus-on var:IS_TMUX   alt+2           send_key ctrl+a 2
map --when-focus-on var:IS_TMUX   alt+3           send_key ctrl+a 3
map --when-focus-on var:IS_TMUX   alt+4           send_key ctrl+a 4
map --when-focus-on var:IS_TMUX   alt+5           send_key ctrl+a 5
map --when-focus-on var:IS_TMUX   alt+6           send_key ctrl+a 6

map --when-focus-on var:IS_TMUX   cmd+w
map --when-focus-on var:IS_TMUX   cmd+f
map --when-focus-on var:IS_TMUX   cmd+r
map --when-focus-on var:IS_TMUX   cmd+shift+f
map --when-focus-on var:IS_TMUX   cmd+s
map --when-focus-on var:IS_TMUX   cmd+e
map --when-focus-on var:IS_TMUX   cmd+enter       send_key ctrl+a z

map --when-focus-on var:IS_TMUX   cmd+t           send_key ctrl+a c
map --when-focus-on var:IS_TMUX   cmd+[           send_key ctrl+a n    
map --when-focus-on var:IS_TMUX   cmd+]           send_key ctrl+a p

map --when-focus-on var:IS_TMUX   ctrl+shift+h
map --when-focus-on var:IS_TMUX   ctrl+shift+l
map --when-focus-on var:IS_TMUX   ctrl+shift+k
map --when-focus-on var:IS_TMUX   ctrl+shift+j

map --when-focus-on var:IS_TMUX   cmd+shift+h
map --when-focus-on var:IS_TMUX   cmd+shift+l 
map --when-focus-on var:IS_TMUX   cmd+shift+k 
map --when-focus-on var:IS_TMUX   cmd+shift+j

#}}}

