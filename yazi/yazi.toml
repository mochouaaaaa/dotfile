[mgr]
linemode = "size"
show_hidden = true
sort_by = "natural"
visibility_rules = [{ dir = ".", hide = "^\\.DS_Store$" }]


[opener]
folder = [
  { run = 'nvim %s', block = true, desc = "neovim" },
  { run = 'code %s', orphan = true, desc = "vscode" },
  { run = 'zeditor %s', orphan = true, desc = "zed" },
  { run = 'neovide %s', block = true, desc = "neovide" },
  { run = 'open %s', desc = "open", for = "macos" },
  { run = "xdg-open %s", for = "linux" },
]

archive = [
  { run = 'unar %s', desc = "Extract here" },
  { run = 'ouch decompress %s', orphan = true, desc = "ouch decompress" },
  { run = '/Applications/MacZip.app/Contents/MacOS/MacZip %s', orphan = true, desc = "MacZip", for = "macos" },
]

text = [
  { run = "${EDITOR:=vi} %s", desc = "$EDITOR", block = true },
  { run = 'code %s', orphan = true, desc = "vscode" },
  { run = 'zeditor %s', orphan = true, desc = "zed" },
  { run = 'gedit %s', orphan = true, desc = "gedit", for = "linux" },
]

image = [
  { run = 'mirage %s', orphan = true, desc = "mirage", for = "linux" },
  { run = 'chafa %s', orphan = true, desc = "chafa", for = "unix" },
]


play = [
  { run = "mpv --force-window %s", desc = "mpv" },
  { run = "iina --no-stdin %s", for = "macos" },
  # { run = 'ffmpeg -i "$@" -vf "fps=10" -loop 0 "$@".gif', orphan = true, desc = "change to gif" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read", block = true, desc = "Show media info" },
]

document = [
  { run = 'open %s', orphan = true, desc = "open" },
  { run = 'zathura %s', orphan = true, desc = "zathura" },
  { run = 'evince %s', orphan = true, desc = "evince", for = "linux" },
]

fallback = [{ run = 'open %s', orphan = true, desc = "open" }]

[open]
rules = [
  { mime = "inode/directory", use = [
    "folder",
  ] },
  { mime = "folder/local", use = [
    "folder",
  ] },

  { mime = "inode/empty", use = [
    "text",
  ] },
  { mime = "text/*", use = [
    "text",
  ] },
  { mime = "image/*", use = [
    "image",
  ] },
  { mime = "video/*", use = [
    "play",
  ] },
  { mime = "audio/*", use = [
    "play",
  ] },
  { mime = "inode/x-empty", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/json", use = [
    "text",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/zip", use = [
    "archive",
  ] },
  { mime = "application/gzip", use = [
    "archive",
  ] },
  { mime = "application/x-bzip", use = [
    "archive",
  ] },
  { mime = "application/x-bzip2", use = [
    "archive",
  ] },
  { mime = "application/x-tar", use = [
    "archive",
  ] },
  { mime = "application/x-7z-compressed", use = [
    "archive",
  ] },
  { mime = "application/x-rar", use = [
    "archive",
  ] },
  { mime = "application/pdf", use = [
    "document",
  ] },
  { mime = "application/epub+zip", use = [
    "document",
  ] },
  { mime = "application/x-mobipocket-ebook", use = [
    "document",
  ] },

  { url = "*", use = [
    "fallback",
  ] },
]

[plugin]
prepend_previewers = [
  { mime = "folder/local", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
  { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },

  { url = "*.html", run = "html" },
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w "$1"' },

  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.json", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },

  { url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },

  { mime = "text/html", run = "html" },
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
  { mime = "application/epub+zip", run = "epub-preview" },
  { mime = "application/octet-stream", run = "play" },
]

prepend_preloaders = [
  { url = "*.csv", run = "duckdb", multi = false },
  { url = "*.tsv", run = "duckdb", multi = false },
  { url = "*.json", run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },
]

prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

[log]
enabled = false

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
