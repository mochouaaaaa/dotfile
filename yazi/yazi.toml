[mgr]
show_hidden = true

[opener]
folder = [
  { run = 'nvim "$@"', block = true, desc = "neovim" },
  { run = 'code "$@"', orphan = true, desc = "vscode" },
  { run = 'zeditor "$@"', orphan = true, desc = "zed" },
  { run = 'neovide "$@"', block = true, desc = "neovide" },
  { run = 'open "$@"', orphan = true, desc = "open" },
]
archive = [
  { run = 'unar "$1"', desc = "Extract here" },
  { run = 'ouch decompress "$1" ', orphan = true, desc = "ouch decompress" },
  { run = '/Applications/MacZip.app/Contents/MacOS/MacZip "$1"', orphan = true, desc = "MacZip", for = "unix" },
]
text = [
  { run = 'nvim "$@"', block = true, desc = "neovim" },
  { run = 'code  "$@"', orphan = true, desc = "vscode" },
  { run = 'zeditor "$@"', orphan = true, desc = "zed" },
  { run = 'gedit "$@" ', orphan = true, desc = "gedit", for = "linux" },
  { run = 'zathura "$@"', orphan = true, desc = "zathura", for = "linux" },
]
image = [
  { run = 'mirage  "$@"', orphan = true, desc = "mirage", for = "linux" },
  { run = 'chafa "$@"', orphan = true, desc = "chafa", for = "unix" },
]

video = [
  { run = 'mpv "$@" ', orphan = true, desc = "mpv" },
  { run = '/Applications/IINA.app/Contents/MacOS/IINA "$@"', desc = "IINA", for = "unix" },
  { run = 'ffmpeg -i "$@" -vf "fps=10" -loop 0 "$@".gif', orphan = true, desc = "change to gif" },
]
audio = [{ run = 'mpv "$@" ', orphan = true, desc = "mpv" }]
document = [
  { run = 'open "$@"', orphan = true, desc = "open" },
  { run = 'zathura "$@" ', orphan = true, desc = "zathura" },
  { run = 'evince "$@" ', orphan = true, desc = "evince", for = "linux" },
]

fallback = [{ run = 'open "$@"', orphan = true, desc = "open" }]

[open]
rules = [
  { mime = "*/", use = [
    "folder",
  ] },

  { mime = "text/*", use = [
    "text",
  ] },
  { mime = "image/*", use = [
    "image",
  ] },
  { mime = "video/*", use = [
    "video",
  ] },
  { mime = "audio/*", use = [
    "audio",
  ] },
  { mime = "application/octet-stream", use = [
    "video",
  ] },
  { mime = "inode/x-empty", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/json", use = [
    "text",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/zip", use = [
    "archive",
  ] },
  { mime = "application/gzip", use = [
    "archive",
  ] },
  { mime = "application/x-bzip", use = [
    "archive",
  ] },
  { mime = "application/x-bzip2", use = [
    "archive",
  ] },
  { mime = "application/x-tar", use = [
    "archive",
  ] },
  { mime = "application/x-7z-compressed", use = [
    "archive",
  ] },
  { mime = "application/x-rar", use = [
    "archive",
  ] },
  { mime = "application/pdf", use = [
    "document",
  ] },
  { mime = "application/epub+zip", use = [
    "document",
  ] },
  { mime = "application/x-mobipocket-ebook", use = [
    "document",
  ] },

  { url = "*", use = [
    "fallback",
  ] },
]

[plugin]
prepend_previewers = [
  { mime = "inode/directory", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
  { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },

  { url = "*.html", run = "html" },
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },

  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.json", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },

  { url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },

  { mime = "text/html", run = "html" },
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
  { mime = "application/epub+zip", run = "epub-preview" },
  { mime = "application/octet-stream", run = "video" },
]
prepend_preloaders = [
  { url = "*.csv", run = "duckdb", multi = false },
  { url = "*.tsv", run = "duckdb", multi = false },
  { url = "*.json", run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },
]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

[log]
enabled = false

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
