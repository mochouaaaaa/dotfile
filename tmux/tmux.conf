# Optional tmux integration for Kitty's native conditional keymaps.
#
# Allow OSC 1337 SetUserVar notifications from shells and Neovim to reach the
# outer terminal. This is required for IS_TMUX / IS_NVIM conditional mappings.
# On tmux 3.3+, passthrough must be enabled explicitly.
set -g allow-passthrough on

# Preserve modified keys for applications running inside tmux.
set -s extended-keys on
set -s extended-keys-format csi-u

# Forward focus changes to applications that support them.
set -g focus-events on
